<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Log Admin AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .card h2 {
            font-size: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            color: white;
            font-family: monospace;
            font-size: 13px;
        }
        
        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: white;
            color: black;
            border: none;
        }
        
        .btn-primary:hover {
            background: #e0e0e0;
        }
        
        .status {
            margin-top: 12px;
            font-size: 13px;
            padding: 8px;
            border-radius: 8px;
            display: none;
        }
        
        .status.success {
            background: #22c55e20;
            color: #22c55e;
            border: 1px solid #22c55e30;
            display: block;
        }
        
        .status.error {
            background: #ef444420;
            color: #ef4444;
            border: 1px solid #ef444430;
            display: block;
        }
        
        .status.info {
            background: #3b82f620;
            color: #3b82f6;
            border: 1px solid #3b82f630;
            display: block;
        }
        
        .output {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 16px 0;
            border: 1px solid #222;
        }
        
        .copy-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        
        .log {
            background: #050505;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid #1a1a1a;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #111;
        }
        
        .log-time {
            color: #666;
            margin-right: 10px;
        }
        
        .log-success { color: #22c55e; }
        .log-error { color: #ef4444; }
        .log-info { color: #3b82f6; }
        
        .flex {
            display: flex;
            gap: 10px;
        }
        
        .flex-1 {
            flex: 1;
        }
        
        .mt-3 {
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blank Log Admin AI</h1>
        <div class="subtitle">API Key Extraction Tool</div>
        
        <!-- TikTok Card -->
        <div class="card">
            <h2>🎵 TikTok Developer</h2>
            <div class="input-group">
                <label>Client ID</label>
                <input type="text" id="tiktokId" placeholder="Will appear here after extraction">
            </div>
            <div class="input-group">
                <label>Client Secret</label>
                <input type="text" id="tiktokSecret" placeholder="Will appear here after extraction">
            </div>
            <button class="btn btn-primary" id="tiktokBtn">Extract TikTok Keys</button>
            <div id="tiktokStatus" class="status"></div>
        </div>
        
        <!-- Google Card -->
        <div class="card">
            <h2>☁️ Google Cloud (YouTube)</h2>
            <div class="flex">
                <div class="flex-1 input-group">
                    <label>API Key</label>
                    <input type="text" id="googleApiKey" placeholder="Will appear here">
                </div>
            </div>
            <div class="flex">
                <div class="flex-1 input-group">
                    <label>Client ID</label>
                    <input type="text" id="googleClientId" placeholder="Will appear here">
                </div>
                <div class="flex-1 input-group">
                    <label>Client Secret</label>
                    <input type="text" id="googleClientSecret" placeholder="Will appear here">
                </div>
            </div>
            <button class="btn btn-primary" id="googleBtn">Extract Google Keys</button>
            <div id="googleStatus" class="status"></div>
        </div>
        
        <!-- Meta Card -->
        <div class="card">
            <h2>📸 Meta (Instagram)</h2>
            <div class="flex">
                <div class="flex-1 input-group">
                    <label>App ID</label>
                    <input type="text" id="metaAppId" placeholder="Will appear here">
                </div>
                <div class="flex-1 input-group">
                    <label>App Secret</label>
                    <input type="text" id="metaAppSecret" placeholder="Will appear here">
                </div>
            </div>
            <button class="btn btn-primary" id="metaBtn">Extract Meta Keys</button>
            <div id="metaStatus" class="status"></div>
        </div>
        
        <!-- Output -->
        <div class="card">
            <h2>📋 All Extracted Keys</h2>
            <div class="output" id="output">
{
  "status": "No keys extracted yet"
}
            </div>
            <button class="copy-btn" id="copyBtn">Copy All Keys</button>
        </div>
        
        <!-- Log -->
        <div class="log" id="log">
            <div class="log-entry"><span class="log-time">[START]</span><span class="log-info">Admin AI ready</span></div>
        </div>
    </div>
    
    <script>
        let keys = {
            tiktok: { id: '', secret: '' },
            google: { apiKey: '', clientId: '', clientSecret: '' },
            meta: { appId: '', appSecret: '' }
        };
        
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const logClass = type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : 'log-info';
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="${logClass}">${message}</span>`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        function updateOutput() {
            const output = {
                extractedAt: new Date().toISOString(),
                tiktok: {
                    client_id: keys.tiktok.id || "NOT_EXTRACTED",
                    client_secret: keys.tiktok.secret || "NOT_EXTRACTED"
                },
                google: {
                    api_key: keys.google.apiKey || "NOT_EXTRACTED",
                    client_id: keys.google.clientId || "NOT_EXTRACTED",
                    client_secret: keys.google.clientSecret || "NOT_EXTRACTED"
                },
                meta: {
                    app_id: keys.meta.appId || "NOT_EXTRACTED",
                    app_secret: keys.meta.appSecret || "NOT_EXTRACTED"
                }
            };
            document.getElementById('output').textContent = JSON.stringify(output, null, 2);
            
            document.getElementById('tiktokId').value = keys.tiktok.id || '';
            document.getElementById('tiktokSecret').value = keys.tiktok.secret || '';
            document.getElementById('googleApiKey').value = keys.google.apiKey || '';
            document.getElementById('googleClientId').value = keys.google.clientId || '';
            document.getElementById('googleClientSecret').value = keys.google.clientSecret || '';
            document.getElementById('metaAppId').value = keys.meta.appId || '';
            document.getElementById('metaAppSecret').value = keys.meta.appSecret || '';
        }
        
        async function extractTikTok() {
            const btn = document.getElementById('tiktokBtn');
            const statusDiv = document.getElementById('tiktokStatus');
            
            btn.disabled = true;
            btn.textContent = 'Extracting...';
            statusDiv.className = 'status info';
            statusDiv.textContent = 'Please enter your credentials...';
            statusDiv.style.display = 'block';
            
            const email = prompt('Enter your TikTok email:');
            if (!email) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Extraction cancelled';
                btn.disabled = false;
                btn.textContent = 'Extract TikTok Keys';
                return;
            }
            
            const password = prompt('Enter your TikTok password:');
            if (!password) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Extraction cancelled';
                btn.disabled = false;
                btn.textContent = 'Extract TikTok Keys';
                return;
            }
            
            addLog('Starting TikTok extraction...', 'info');
            statusDiv.textContent = 'Extracting... this may take a minute';
            
            try {
                const response = await fetch('/api/tiktok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.clientId && data.clientId !== 'MANUAL_REQUIRED') {
                        keys.tiktok.id = data.clientId;
                        keys.tiktok.secret = data.clientSecret;
                        addLog(`TikTok Client ID: ${data.clientId}`, 'success');
                        statusDiv.className = 'status success';
                        statusDiv.textContent = 'TikTok keys extracted successfully!';
                    } else {
                        statusDiv.className = 'status info';
                        statusDiv.textContent = 'Login successful! Check TikTok Developer Portal manually for keys.';
                        addLog('TikTok login successful. Please copy keys manually from developers.tiktok.com', 'success');
                    }
                    updateOutput();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                addLog(`TikTok extraction failed: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `Error: ${error.message}`;
            }
            
            btn.disabled = false;
            btn.textContent = 'Extract TikTok Keys';
        }
        
        async function extractGoogle() {
            const btn = document.getElementById('googleBtn');
            const statusDiv = document.getElementById('googleStatus');
            
            btn.disabled = true;
            btn.textContent = 'Extracting...';
            statusDiv.className = 'status info';
            statusDiv.textContent = 'Please enter your credentials...';
            
            const email = prompt('Enter your Google email:');
            if (!email) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Extraction cancelled';
                btn.disabled = false;
                btn.textContent = 'Extract Google Keys';
                return;
            }
            
            const password = prompt('Enter your Google password:');
            if (!password) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Extraction cancelled';
                btn.disabled = false;
                btn.textContent = 'Extract Google Keys';
                return;
            }
            
            addLog('Starting Google extraction...', 'info');
            statusDiv.textContent = 'Extracting...';
            
            try {
                const response = await fetch('/api/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = 'Login successful! Check Google Cloud Console manually for keys.';
                    addLog('Google login successful. Please copy API keys from console.cloud.google.com', 'success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                addLog(`Google extraction failed: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `Error: ${error.message}`;
            }
            
            btn.disabled = false;
            btn.textContent = 'Extract Google Keys';
        }
        
        async function extractMeta() {
            const btn = document.getElementById('metaBtn');
            const statusDiv = document.getElementById('metaStatus');
            
            btn.disabled = true;
            btn.textContent = 'Extracting...';
            statusDiv.className = 'status info';
            statusDiv.textContent = 'Please enter your credentials...';
            
            const email = prompt('Enter your Facebook email:');
            if (!email) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Extraction cancelled';
                btn.disabled = false;
                btn.textContent = 'Extract Meta Keys';
                return;
            }
            
            const password = prompt('Enter your Facebook password:');
            if (!password) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Extraction cancelled';
                btn.disabled = false;
                btn.textContent = 'Extract Meta Keys';
                return;
            }
            
            addLog('Starting Meta extraction...', 'info');
            statusDiv.textContent = 'Extracting...';
            
            try {
                const response = await fetch('/api/meta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = 'Login successful! Check Meta Developer Portal manually for keys.';
                    addLog('Meta login successful. Please copy App ID and Secret from developers.facebook.com', 'success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                addLog(`Meta extraction failed: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `Error: ${error.message}`;
            }
            
            btn.disabled = false;
            btn.textContent = 'Extract Meta Keys';
        }
        
        function copyAllKeys() {
            const output = document.getElementById('output').textContent;
            navigator.clipboard.writeText(output);
            addLog('Keys copied to clipboard!', 'success');
            alert('Keys copied! Send them to your developer.');
        }
        
        document.getElementById('tiktokBtn').onclick = extractTikTok;
        document.getElementById('googleBtn').onclick = extractGoogle;
        document.getElementById('metaBtn').onclick = extractMeta;
        document.getElementById('copyBtn').onclick = copyAllKeys;
        
        updateOutput();
        addLog('Admin AI ready. Click a button to start extraction.', 'success');
    </script>
</body>
</html>
